<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anime</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f0f10; color: #e5e5e5; font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
  button { font-family: inherit; }

  #topbar { display: flex; gap: 8px; padding: 10px 16px; background: #1a1a1c; border-bottom: 1px solid #2a2a2c; align-items: center; position: sticky; top: 0; z-index: 50; flex-wrap: wrap; }
  #topbar input { background: #26262a; border: 1px solid #333; color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 14px; flex: 1; min-width: 120px; }
  #topbar button { background: #e63946; color: #fff; border: 0; padding: 9px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; }
  #topbar button.ghost { background: #333; }
  #topbar button:hover { filter: brightness(1.15); }
  #userInfo { color: #9a9a9a; font-size: 14px; }

  #tabs { display: flex; gap: 0; background: #1a1a1c; padding: 0 16px; border-bottom: 1px solid #2a2a2c; overflow-x: auto; }
  .tab { padding: 12px 20px; cursor: pointer; color: #9a9a9a; font-size: 15px; font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; }
  .tab:hover { color: #fff; }
  .tab.active { color: #fff; border-bottom-color: #e63946; }

  #app { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
  .card { cursor: pointer; transition: transform 0.15s; }
  .card:hover { transform: translateY(-4px); }
  .card-poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 8px; background: #1a1a1c; display: block; }
  .card-poster-ph { width: 100%; aspect-ratio: 2/3; border-radius: 8px; background: linear-gradient(135deg, #1a1a1c, #2a2a2c); display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: 700; color: #444; }
  .card-title { margin-top: 8px; font-size: 14px; line-height: 1.3; font-weight: 500; }
  .card-meta { color: #7a7a7a; font-size: 12px; margin-top: 2px; }

  .section-title { font-size: 20px; font-weight: 700; margin: 24px 0 16px; }

  .title-layout { display: grid; grid-template-columns: 260px 1fr; gap: 32px; margin-bottom: 32px; }
  .title-poster { width: 100%; border-radius: 8px; box-shadow: 0 4px 24px rgba(0,0,0,0.5); background: #1a1a1c; aspect-ratio: 2/3; object-fit: cover; }
  .title-poster-ph { width: 100%; aspect-ratio: 2/3; border-radius: 8px; background: linear-gradient(135deg, #1a1a1c, #2a2a2c); display: flex; align-items: center; justify-content: center; font-size: 72px; font-weight: 700; color: #444; }
  .title-name { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
  .title-orig { color: #7a7a7a; font-size: 14px; margin-bottom: 16px; }
  .title-meta { color: #9a9a9a; font-size: 14px; margin-bottom: 6px; }
  .title-genres { color: #c4a4ff; font-size: 13px; margin: 12px 0; }
  .title-desc { color: #b8b8b8; line-height: 1.6; font-size: 15px; margin-top: 16px; }

  #playerWrap { position: relative; width: 100%; aspect-ratio: 16 / 9; margin-bottom: 24px; background: #000; border-radius: 8px; overflow: hidden; }
  #player { width: 100%; height: 100%; display: block; background: #000; object-fit: contain; }
  #playerUI { position: absolute; inset: 0; user-select: none; }
  #playerUI.hidden-ui .ui-top, #playerUI.hidden-ui .ui-bottom { opacity: 0; pointer-events: none; }
  #playerUI .ui-top, #playerUI .ui-bottom { transition: opacity 0.25s; }

  .ui-top { position: absolute; top: 0; left: 0; right: 0; padding: 16px 20px; background: linear-gradient(to bottom, rgba(0,0,0,0.75), transparent); pointer-events: none; }
  .ui-title { font-size: 16px; font-weight: 600; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
  .ui-sub { font-size: 13px; color: #ccc; margin-top: 2px; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }

  .ui-bottom { position: absolute; bottom: 0; left: 0; right: 0; padding: 8px 16px 12px; background: linear-gradient(to top, rgba(0,0,0,0.85), transparent); }
  .progress-row { padding: 8px 0; cursor: pointer; position: relative; }
  .progress-bar { height: 4px; background: rgba(255,255,255,0.25); border-radius: 2px; position: relative; transition: height 0.15s; }
  .progress-row:hover .progress-bar { height: 6px; }
  .progress-loaded { position: absolute; top: 0; left: 0; height: 100%; background: rgba(255,255,255,0.4); border-radius: 2px; }
  .progress-played { position: absolute; top: 0; left: 0; height: 100%; background: #e63946; border-radius: 2px; }
  .progress-thumb { position: absolute; top: 50%; width: 12px; height: 12px; background: #e63946; border-radius: 50%; transform: translate(-50%, -50%); opacity: 0; transition: opacity 0.15s; }
  .progress-row:hover .progress-thumb { opacity: 1; }
  .time-tooltip { position: absolute; bottom: 20px; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: #fff; font-size: 12px; padding: 4px 8px; border-radius: 4px; pointer-events: none; opacity: 0; transition: opacity 0.15s; }
  .progress-row:hover .time-tooltip { opacity: 1; }

  .controls-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; flex-wrap: wrap; }
  .ctrl-btn { background: transparent; border: 0; color: #fff; cursor: pointer; padding: 6px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 18px; line-height: 1; }
  .ctrl-btn:hover { background: rgba(255,255,255,0.1); }
  .ctrl-btn svg { width: 22px; height: 22px; fill: currentColor; }
  .ctrl-btn.play svg { width: 28px; height: 28px; }
  .ctrl-time { color: #fff; font-size: 13px; padding: 0 6px; font-variant-numeric: tabular-nums; text-shadow: 0 1px 3px rgba(0,0,0,0.9); }
  .ctrl-spacer { flex: 1; }

  .ctrl-dropdown { position: relative; }
  .ctrl-dropdown .ctrl-btn { font-size: 13px; font-weight: 600; padding: 6px 10px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ctrl-menu { position: absolute; bottom: 100%; right: 0; margin-bottom: 8px; background: #1a1a1c; border: 1px solid #333; border-radius: 6px; min-width: 240px; max-height: 320px; overflow-y: auto; padding: 4px; display: none; z-index: 60; }
  .ctrl-dropdown.open .ctrl-menu { display: block; }
  .ctrl-menu-item { padding: 8px 12px; cursor: pointer; font-size: 13px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ctrl-menu-item:hover { background: #2a2a2c; }
  .ctrl-menu-item.active { background: #e63946; color: #fff; }

  .ctrl-volume { display: flex; align-items: center; gap: 4px; }
  .ctrl-volume input { width: 70px; accent-color: #e63946; }

  .history-card { display: flex; gap: 12px; background: #1a1a1c; border-radius: 8px; padding: 12px; margin-bottom: 12px; cursor: pointer; align-items: center; position: relative; }
  .history-card:hover { background: #26262a; }
  .history-poster { width: 60px; height: 90px; object-fit: cover; border-radius: 4px; flex-shrink: 0; background: #26262a; }
  .history-poster-ph { width: 60px; height: 90px; border-radius: 4px; flex-shrink: 0; background: linear-gradient(135deg, #1a1a1c, #2a2a2c); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; color: #444; }
  .history-info { flex: 1; min-width: 0; }
  .history-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .history-sub { color: #9a9a9a; font-size: 13px; }
  .history-badge { background: #2a7fff; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
  .history-remove { background: transparent; border: 0; color: #666; cursor: pointer; padding: 6px 10px; border-radius: 4px; font-size: 18px; line-height: 1; }
  .history-remove:hover { background: #3a1a1a; color: #ff9999; }

  .status { padding: 12px; background: #26262a; border-radius: 6px; margin: 16px 0; color: #9a9a9a; font-size: 14px; }
  .error { background: #3a1a1a; color: #ff9999; border-left: 3px solid #e63946; }
  .hidden { display: none !important; }

  #loginModal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
  #loginBox { background: #1a1a1c; padding: 28px; border-radius: 12px; width: 100%; max-width: 380px; }
  #loginBox h2 { margin-bottom: 16px; font-size: 22px; }
  .login-tabs { display: flex; gap: 0; margin-bottom: 20px; border-bottom: 1px solid #333; }
  .login-tab { padding: 10px 20px; cursor: pointer; color: #9a9a9a; font-size: 15px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .login-tab.active { color: #fff; border-bottom-color: #e63946; }
  #loginBox input { width: 100%; background: #26262a; border: 1px solid #333; color: #fff; padding: 11px 14px; border-radius: 6px; font-size: 14px; margin-bottom: 12px; }
  .pass-wrap { position: relative; margin-bottom: 12px; }
  .pass-wrap input { margin-bottom: 0; padding-right: 44px; }
  .pass-eye { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #9a9a9a; font-size: 18px; user-select: none; }
  .pass-eye:hover { color: #fff; }
  #loginBox button { width: 100%; background: #e63946; color: #fff; border: 0; padding: 12px; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: 600; }
  #loginBox .err { color: #ff9999; font-size: 13px; margin-top: 12px; min-height: 16px; text-align: center; }

  @media (max-width: 720px) {
    #app { padding: 16px 12px; }
    #topbar { padding: 8px 12px; gap: 6px; }
    #topbar input { font-size: 15px; padding: 10px 12px; }
    #topbar button { padding: 10px 14px; font-size: 14px; }
    .title-layout { grid-template-columns: 1fr; gap: 16px; }
    .title-poster, .title-poster-ph { max-width: 200px; margin: 0 auto; display: block; }
    .title-name { font-size: 22px; text-align: center; }
    .title-orig { text-align: center; }
    .title-meta { text-align: center; }
    .title-genres { text-align: center; }
    .title-desc { font-size: 14px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
    .card-title { font-size: 13px; }
    .card-poster-ph { font-size: 36px; }
    .section-title { font-size: 18px; }
    .tab { padding: 12px 16px; font-size: 14px; }
    .history-poster, .history-poster-ph { width: 50px; height: 75px; }
    .ctrl-volume input { width: 50px; }
    .ctrl-time { font-size: 12px; }
    .ui-title { font-size: 14px; }
  }
</style>
</head>
<body>

<div id="topbar">
  <input id="inpSearch" placeholder="Поиск аниме..." autocomplete="new-password" name="q_search_field">
  <button onclick="doSearch()">Найти</button>
  <span id="userInfo"></span>
  <button id="btnLogout" class="ghost hidden" onclick="logout()">Выйти</button>
</div>

<div id="tabs">
  <div class="tab active" data-tab="home" onclick="switchTab('home')">Главная</div>
  <div class="tab" data-tab="history" onclick="switchTab('history')">История</div>
</div>

<div id="app">
  <div id="content"></div>
</div>

<div id="loginModal" class="hidden">
  <div id="loginBox">
    <div class="login-tabs">
      <div class="login-tab active" data-lt="login" onclick="switchLoginTab('login')">Вход</div>
      <div class="login-tab" data-lt="register" onclick="switchLoginTab('register')">Регистрация</div>
    </div>
    <div id="formLogin">
      <input id="loginUser" placeholder="Логин" autocomplete="username">
      <div class="pass-wrap">
        <input id="loginPass" type="password" placeholder="Пароль" autocomplete="current-password">
        <span class="pass-eye" onclick="togglePass('loginPass', this)">👁</span>
      </div>
      <button onclick="doLogin()">Войти</button>
    </div>
    <div id="formRegister" class="hidden">
      <input id="regUser" placeholder="Логин (от 3 символов)" autocomplete="username">
      <div class="pass-wrap">
        <input id="regPass" type="password" placeholder="Пароль (от 6 символов)" autocomplete="new-password">
        <span class="pass-eye" onclick="togglePass('regPass', this)">👁</span>
      </div>
      <div class="pass-wrap">
        <input id="regPass2" type="password" placeholder="Повтори пароль" autocomplete="new-password">
        <span class="pass-eye" onclick="togglePass('regPass2', this)">👁</span>
      </div>
      <button onclick="doRegister()">Зарегистрироваться</button>
    </div>
    <div id="loginError" class="err"></div>
  </div>
</div>

<script>
const API = 'https://anime-app-v2.onrender.com';

let token = localStorage.getItem('token');
let username = localStorage.getItem('username');
let currentTab = 'home';

let currentTitle = null;
let currentEpisode = null;
let currentTranslationId = null;
let currentQuality = 'auto';
let currentHls = null;
let progressTimer = null;
let currentSeconds = 0;
let currentDuration = 0;
let uiHideTimer = null;
let _autoStarted = false;

function proxyPoster(url) {
  if (!url) return '';
  return API + '/api/poster?url=' + encodeURIComponent(url);
}

function letter0(title) {
  return (title || '?')[0].toUpperCase();
}

function posterHtml(url, title, cls) {
  if (!url) {
    return `<div class="${cls}-ph">${letter0(title)}</div>`;
  }
  const t = String(title || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
  return `<img class="${cls}" src="${proxyPoster(url)}" loading="lazy" alt="" onerror="this.onerror=null;this.style.display='none';var p=this.parentNode;p.insertAdjacentHTML('beforeend','<div class=\\'${cls}-ph\\'>${letter0(title)}</div>')">`;
}

function fmtTime(sec) {
  if (!sec || sec < 0 || !isFinite(sec)) return '00:00';
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = Math.floor(sec % 60);
  if (h > 0) return h + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function authHeaders() {
  return token ? { 'Authorization': 'Bearer ' + token } : {};
}

function isMobile() {
  return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}

function defaultQuality() {
  return isMobile() ? '480' : '720';
}

function updateUserUI() {
  document.getElementById('userInfo').textContent = token && username ? '👤 ' + username : '';
  document.getElementById('btnLogout').classList.toggle('hidden', !token);
  document.getElementById('loginModal').classList.toggle('hidden', !!token);
}

function switchLoginTab(tab) {
  document.querySelectorAll('.login-tab').forEach(t => t.classList.toggle('active', t.dataset.lt === tab));
  document.getElementById('formLogin').classList.toggle('hidden', tab !== 'login');
  document.getElementById('formRegister').classList.toggle('hidden', tab !== 'register');
  document.getElementById('loginError').textContent = '';
}

function togglePass(id, el) {
  const inp = document.getElementById(id);
  inp.type = inp.type === 'password' ? 'text' : 'password';
  el.textContent = inp.type === 'password' ? '👁' : '🙈';
}

async function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const err = document.getElementById('loginError');
  err.textContent = '';
  try {
    const r = await fetch(API + '/api/auth/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: u, password: p})
    });
    const data = await r.json();
    if (!r.ok) { err.textContent = data.error || 'Ошибка'; return; }
    token = data.token; username = data.username;
    localStorage.setItem('token', token);
    localStorage.setItem('username', username);
    updateUserUI();
    renderTab();
  } catch (e) { err.textContent = 'Сеть недоступна'; }
}

async function doRegister() {
  const u = document.getElementById('regUser').value.trim();
  const p = document.getElementById('regPass').value;
  const p2 = document.getElementById('regPass2').value;
  const err = document.getElementById('loginError');
  err.textContent = '';
  if (p !== p2) { err.textContent = 'Пароли не совпадают'; return; }
  if (p.length < 6) { err.textContent = 'Пароль от 6 символов'; return; }
  try {
    const r = await fetch(API + '/api/auth/register', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: u, password: p})
    });
    const data = await r.json();
    if (!r.ok) { err.textContent = data.error || 'Ошибка'; return; }
    token = data.token; username = data.username;
    localStorage.setItem('token', token);
    localStorage.setItem('username', username);
    updateUserUI();
    renderTab();
  } catch (e) { err.textContent = 'Сеть недоступна'; }
}

function logout() {
  token = null; username = null;
  localStorage.removeItem('token');
  localStorage.removeItem('username');
  updateUserUI();
  renderTab();
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  if (tab === 'home') history.pushState({}, '', location.pathname);
  else history.pushState({}, '', '#' + tab);
  renderTab();
}

function renderTab() {
  if (currentTab === 'home') renderHome();
  else if (currentTab === 'history') renderHistory();
}

function clearSearchInput() {
  const el = document.getElementById('inpSearch');
  if (el) el.value = '';
}

async function renderHome() {
  clearSearchInput();
  const content = document.getElementById('content');
  content.innerHTML = '<div class="section-title">Онгоинги</div><div id="ongoingGrid" class="grid"><div class="status">Загрузка...</div></div>';
  try {
    const r = await fetch(API + '/api/ongoing');
    const data = await r.json();
    const grid = document.getElementById('ongoingGrid');
    if (!data.length) { grid.innerHTML = '<div class="status">Ничего нет</div>'; return; }
    grid.innerHTML = data.map(item => `
      <div class="card" onclick="openTitle('${item.shikimoriId}')">
        ${posterHtml(item.posterUrl, item.title, 'card-poster')}
        <div class="card-title">${item.title || ''}</div>
        <div class="card-meta">${item.episodes ? item.episodes + ' эп.' : ''} ${item.score ? '⭐ ' + item.score : ''}</div>
      </div>
    `).join('');
  } catch (e) {
    document.getElementById('ongoingGrid').innerHTML = '<div class="status error">Ошибка загрузки: ' + e.message + '</div>';
  }
}

async function doSearch() {
  const q = document.getElementById('inpSearch').value.trim();
  if (q.length < 2) return;
  currentTab = 'home';
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'home'));
  const content = document.getElementById('content');
  content.innerHTML = '<div class="section-title">Результаты: ' + q + '</div><div id="searchGrid" class="grid"><div class="status">Поиск...</div></div>';
  try {
    const r = await fetch(API + '/api/search?q=' + encodeURIComponent(q));
    const data = await r.json();
    const grid = document.getElementById('searchGrid');
    if (!data.length) { grid.innerHTML = '<div class="status">Ничего не найдено</div>'; return; }
    grid.innerHTML = data.map(item => `
      <div class="card" onclick="openTitle('${item.shikimoriId}')">
        ${posterHtml(item.posterUrl, item.title, 'card-poster')}
        <div class="card-title">${item.title || ''}</div>
        <div class="card-meta">${item.episodes ? item.episodes + ' эп.' : ''} ${item.score ? '⭐ ' + item.score : ''}</div>
      </div>
    `).join('');
  } catch (e) {
    document.getElementById('searchGrid').innerHTML = '<div class="status error">Ошибка: ' + e.message + '</div>';
  }
}

async function renderHistory() {
  const content = document.getElementById('content');
  clearSearchInput();
  if (!token) {
    content.innerHTML = '<div class="status">Войди в аккаунт чтобы увидеть историю</div>';
    return;
  }
  content.innerHTML = '<div class="section-title">История просмотра</div><div id="historyList"><div class="status">Загрузка...</div></div>';
  try {
    const r = await fetch(API + '/api/progress', { headers: authHeaders() });
    const data = await r.json();
    const list = document.getElementById('historyList');
    if (!data.length) { list.innerHTML = '<div class="status">Пока ничего не смотрел</div>'; return; }
    list.innerHTML = data.map(item => {
      const parts = ['Серия ' + item.episode, fmtTime(item.seconds)];
      if (item.translation_name) parts.push(item.translation_name);
      const sub = parts.join(' · ');
      return `
      <div class="history-card" onclick="openTitleFromHistory('${item.shikimori_id}', ${item.episode}, ${item.translation_id || 0}, ${item.seconds || 0})">
        ${posterHtml(item.poster_url, item.title, 'history-poster')}
        <div class="history-info">
          <div class="history-title">${item.title || ''}</div>
          <div class="history-sub">${sub}</div>
        </div>
        <div class="history-badge">⏵ Продолжить</div>
        <button class="history-remove" title="Удалить из истории" onclick="removeFromHistory(event, '${item.shikimori_id}')">✕</button>
      </div>
    `;
    }).join('');
  } catch (e) {
    document.getElementById('historyList').innerHTML = '<div class="status error">Ошибка: ' + e.message + '</div>';
  }
}

async function removeFromHistory(e, shikimoriId) {
  e.stopPropagation();
  if (!confirm('Удалить этот тайтл из истории?')) return;
  try {
    const r = await fetch(API + '/api/progress/' + shikimoriId, {
      method: 'DELETE',
      headers: authHeaders()
    });
    if (r.ok) {
      renderHistory();
    } else {
      alert('Не удалось удалить: HTTP ' + r.status);
    }
  } catch (err) {
    alert('Ошибка: ' + err.message);
  }
}

function openTitleFromHistory(id, ep, tr, sec) {
  const params = new URLSearchParams();
  params.set('id', id);
  params.set('ep', ep);
  if (tr) params.set('tr', tr);
  if (sec) params.set('t', Math.floor(sec));
  history.pushState({}, '', '?' + params.toString());
  openTitle(id, { ep: ep, tr: tr, t: sec });
}

async function openTitle(id, opts) {
  opts = opts || {};
  currentTab = 'title';
  _autoStarted = false;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const content = document.getElementById('content');
  content.innerHTML = '<div class="status">Загрузка тайтла...</div>';
  try {
    const r = await fetch(API + '/api/title/' + id);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    currentTitle = await r.json();
    renderTitle();

    const explicitEp = opts.ep != null && opts.ep !== '' && opts.ep !== 0;
    if (explicitEp) {
      playEpisode(opts.ep, opts.tr, opts.t || 0);
      _autoStarted = true;
      return;
    }

    if (!token) {
      autoStartFirst();
      return;
    }

    try {
      const rr = await fetch(API + '/api/progress/' + id, { headers: authHeaders() });
      if (rr.ok) {
        const last = await rr.json();
        if (last && last.episode) return;
      }
    } catch (e) {}

    autoStartFirst();
  } catch (e) {
    content.innerHTML = '<div class="status error">Не удалось загрузить: ' + e.message + '</div>';
  }
}

function autoStartFirst() {
  if (_autoStarted) return;
  _autoStarted = true;
  if (!currentTitle) return;
  const sources = currentTitle.sources?.kodik || [];
  if (!sources.length) return;
  const sorted = [...sources].sort((a, b) =>
    String(a.translation || '').localeCompare(String(b.translation || ''), 'ru')
  );
  const firstTr = sorted[0].translationId;
  playEpisode(1, firstTr, 0);
}

function renderTitle() {
  const t = currentTitle;
  const content = document.getElementById('content');

  content.innerHTML = `
    <div class="title-layout">
      ${posterHtml(t.posterUrl, t.title, 'title-poster')}
      <div>
        <div class="title-name">${t.title || ''}</div>
        <div class="title-orig">${t.originalTitle || ''}</div>
        <div class="title-meta">${t.kind || ''} · ${t.status || ''} · ${t.episodes || '?'} эп. · ⭐ ${t.score || '?'}</div>
        <div class="title-genres">${(t.genres || []).join(' · ')}</div>
        <div class="title-desc">${t.description || ''}</div>
      </div>
    </div>

    <div id="playerWrap">
      <video id="player" playsinline></video>
      <div id="playerUI">
        <div class="ui-top">
          <div class="ui-title" id="uiTitle">${t.title || ''}</div>
          <div class="ui-sub" id="uiSub"></div>
        </div>
        <div class="ui-bottom">
          <div class="progress-row" id="progressRow">
            <div class="progress-bar">
              <div class="progress-loaded" id="progressLoaded"></div>
              <div class="progress-played" id="progressPlayed"></div>
              <div class="progress-thumb" id="progressThumb"></div>
            </div>
            <div class="time-tooltip" id="timeTooltip">00:00</div>
          </div>
          <div class="controls-row">
            <button class="ctrl-btn play" id="btnPlay" onclick="togglePlay()">
              <svg viewBox="0 0 24 24"><path id="iconPlay" d="M8 5v14l11-7z"/></svg>
            </button>
            <span class="ctrl-time" id="timeLabel">00:00 / 00:00</span>
            <div class="ctrl-spacer"></div>

            <div class="ctrl-dropdown" id="ddAudio">
              <button class="ctrl-btn" onclick="toggleDropdown('ddAudio')" title="Озвучка">🎙 <span id="labelAudio"></span></button>
              <div class="ctrl-menu" id="menuAudio"></div>
            </div>

            <div class="ctrl-dropdown" id="ddEpisodes">
              <button class="ctrl-btn" onclick="toggleDropdown('ddEpisodes')" title="Серия">📺 <span id="labelEp"></span></button>
              <div class="ctrl-menu" id="menuEpisodes"></div>
            </div>

            <div class="ctrl-dropdown" id="ddQuality">
              <button class="ctrl-btn" onclick="toggleDropdown('ddQuality')" title="Качество">HD</button>
              <div class="ctrl-menu" id="menuQuality"></div>
            </div>

            <div class="ctrl-volume">
              <button class="ctrl-btn" onclick="toggleMute()" title="Звук">
                <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
              </button>
              <input type="range" id="volumeRange" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)">
            </div>

            <button class="ctrl-btn" onclick="toggleFullscreen()" title="Во весь экран">
              <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  `;

  fillEpisodes();
  fillTranslations();
  bindPlayerEvents();
  reloadProgress();
}

let _episodesList = [];
let _translationsList = [];

function fillEpisodes() {
  const total = currentTitle.episodes || 1;
  _episodesList = [];
  for (let i = 1; i <= total; i++) _episodesList.push(i);
  renderEpisodesMenu();
}

function fillTranslations() {
  const raw = currentTitle.sources?.kodik || [];
  _translationsList = [...raw].sort((a, b) =>
    String(a.translation || '').localeCompare(String(b.translation || ''), 'ru')
  );
  renderAudioMenu();
}

function renderAudioMenu() {
  const menu = document.getElementById('menuAudio');
  if (!menu) return;
  menu.innerHTML = _translationsList.map(s => {
    const active = String(s.translationId) === String(currentTranslationId);
    return `<div class="ctrl-menu-item ${active ? 'active' : ''}" onclick="pickAudio('${s.translationId}')">${s.translation} (${s.type})</div>`;
  }).join('');
  const cur = _translationsList.find(s => String(s.translationId) === String(currentTranslationId));
  const lbl = document.getElementById('labelAudio');
  if (lbl) lbl.textContent = cur ? cur.translation : '';
}

function renderEpisodesMenu() {
  const menu = document.getElementById('menuEpisodes');
  if (!menu) return;
  menu.innerHTML = _episodesList.map(n => {
    const active = n === currentEpisode;
    return `<div class="ctrl-menu-item ${active ? 'active' : ''}" onclick="pickEpisode(${n})">Серия ${n}</div>`;
  }).join('');
  const lbl = document.getElementById('labelEp');
  if (lbl) lbl.textContent = currentEpisode ? 'Серия ' + currentEpisode : '';
}

function renderQualityMenu() {
  const menu = document.getElementById('menuQuality');
  if (!menu) return;
  const opts = [
    { v: 'auto', t: 'Авто' },
    { v: '720', t: '720p' },
    { v: '480', t: '480p' },
    { v: '360', t: '360p' },
  ];
  menu.innerHTML = opts.map(o => {
    const active = (currentQuality || 'auto') === o.v;
    return `<div class="ctrl-menu-item ${active ? 'active' : ''}" onclick="pickQuality('${o.v}')">${o.t}</div>`;
  }).join('');
}

function toggleDropdown(id) {
  const all = document.querySelectorAll('.ctrl-dropdown');
  all.forEach(d => { if (d.id !== id) d.classList.remove('open'); });
  const el = document.getElementById(id);
  if (el) el.classList.toggle('open');
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.ctrl-dropdown')) {
    document.querySelectorAll('.ctrl-dropdown').forEach(d => d.classList.remove('open'));
  }
});

function pickAudio(id) {
  document.querySelectorAll('.ctrl-dropdown').forEach(d => d.classList.remove('open'));
  if (String(id) === String(currentTranslationId)) return;
  playEpisode(currentEpisode, id, currentSeconds);
}

function pickEpisode(n) {
  document.querySelectorAll('.ctrl-dropdown').forEach(d => d.classList.remove('open'));
  if (n === currentEpisode) return;
  playEpisode(n, currentTranslationId, 0);
}

function pickQuality(q) {
  document.querySelectorAll('.ctrl-dropdown').forEach(d => d.classList.remove('open'));
  currentQuality = q;
  renderQualityMenu();
  if (currentEpisode && currentTranslationId) {
    playEpisode(currentEpisode, currentTranslationId, currentSeconds);
  }
}

function bindPlayerEvents() {
  const video = document.getElementById('player');
  if (!video) return;
  video.removeAttribute('controls');
  video.addEventListener('play', updatePlayButton);
  video.addEventListener('pause', updatePlayButton);
  video.addEventListener('timeupdate', updateProgress);
  video.addEventListener('progress', updateLoaded);
  video.addEventListener('loadedmetadata', () => {
    currentDuration = video.duration || 0;
    updateTimeLabel();
  });
  video.addEventListener('ended', () => {
    saveProgress();
    if (currentEpisode < (currentTitle.episodes || 1)) playEpisode(currentEpisode + 1, currentTranslationId, 0);
  });
  video.addEventListener('click', togglePlay);
  video.addEventListener('dblclick', toggleFullscreen);

  const row = document.getElementById('progressRow');
  if (row) {
    row.addEventListener('click', seekFromEvent);
    row.addEventListener('mousemove', showTimeTooltip);
    row.addEventListener('mouseleave', () => { document.getElementById('timeTooltip').style.opacity = 0; });
  }

  const wrap = document.getElementById('playerWrap');
  if (wrap) {
    wrap.addEventListener('mousemove', showUI);
    wrap.addEventListener('touchstart', showUI);
    wrap.addEventListener('mouseleave', scheduleHideUI);
  }

  renderQualityMenu();
  showUI();
}

function showUI() {
  const ui = document.getElementById('playerUI');
  if (!ui) return;
  ui.classList.remove('hidden-ui');
  scheduleHideUI();
}

function scheduleHideUI() {
  if (uiHideTimer) clearTimeout(uiHideTimer);
  uiHideTimer = setTimeout(() => {
    const video = document.getElementById('player');
    if (video && !video.paused) {
      const ui = document.getElementById('playerUI');
      if (ui) ui.classList.add('hidden-ui');
    }
  }, 3000);
}

function updatePlayButton() {
  const video = document.getElementById('player');
  const icon = document.getElementById('iconPlay');
  if (!video || !icon) return;
  if (video.paused) icon.setAttribute('d', 'M8 5v14l11-7z');
  else icon.setAttribute('d', 'M6 4h4v16H6zm8 0h4v16h-4z');
}

function updateProgress() {
  const video = document.getElementById('player');
  if (!video) return;
  currentSeconds = video.currentTime || 0;
  currentDuration = video.duration || 0;
  const played = document.getElementById('progressPlayed');
  const thumb = document.getElementById('progressThumb');
  if (played && currentDuration > 0) {
    const p = (currentSeconds / currentDuration) * 100;
    played.style.width = p + '%';
    if (thumb) thumb.style.left = p + '%';
  }
  updateTimeLabel();
  saveLocalProgress(currentTitle.shikimoriId, currentEpisode, currentSeconds);
}

function updateLoaded() {
  const video = document.getElementById('player');
  if (!video || !video.buffered || video.buffered.length === 0) return;
  const end = video.buffered.end(video.buffered.length - 1);
  const loaded = document.getElementById('progressLoaded');
  if (loaded && currentDuration > 0) {
    loaded.style.width = Math.min(100, (end / currentDuration) * 100) + '%';
  }
}

function updateTimeLabel() {
  const el = document.getElementById('timeLabel');
  if (el) el.textContent = fmtTime(currentSeconds) + ' / ' + fmtTime(currentDuration);
}

function togglePlay() {
  const video = document.getElementById('player');
  if (!video) return;
  if (video.paused) video.play().catch(() => {});
  else video.pause();
  showUI();
}

function setVolume(v) {
  const video = document.getElementById('player');
  if (!video) return;
  video.volume = Number(v);
  video.muted = Number(v) === 0;
}

function toggleMute() {
  const video = document.getElementById('player');
  if (!video) return;
  video.muted = !video.muted;
  const r = document.getElementById('volumeRange');
  if (r) r.value = video.muted ? 0 : video.volume;
}

function toggleFullscreen() {
  const wrap = document.getElementById('playerWrap');
  if (!wrap) return;
  if (document.fullscreenElement) document.exitFullscreen();
  else wrap.requestFullscreen().catch(() => {});
}

function seekFromEvent(e) {
  const row = e.currentTarget;
  const rect = row.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  const video = document.getElementById('player');
  if (!video || !currentDuration) return;
  video.currentTime = Math.max(0, Math.min(currentDuration, x * currentDuration));
}

function showTimeTooltip(e) {
  const row = e.currentTarget;
  const rect = row.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  const tt = document.getElementById('timeTooltip');
  if (!tt) return;
  tt.textContent = fmtTime(x * currentDuration);
  tt.style.left = (x * 100) + '%';
  tt.style.opacity = 1;
}

document.addEventListener('keydown', (e) => {
  if (!currentTitle || currentTab !== 'title') return;
  if (e.target.tagName === 'INPUT') return;
  const video = document.getElementById('player');
  if (!video) return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.code === 'ArrowLeft') video.currentTime = Math.max(0, video.currentTime - 10);
  else if (e.code === 'ArrowRight') video.currentTime = Math.min(video.duration || 0, video.currentTime + 10);
  else if (e.code === 'KeyF') toggleFullscreen();
  else if (e.code === 'KeyM') toggleMute();
});

function resolveQuality() {
  return (currentQuality && currentQuality !== 'auto') ? currentQuality : defaultQuality();
}

function currentTranslationName() {
  const cur = _translationsList.find(s => String(s.translationId) === String(currentTranslationId));
  return cur ? cur.translation : null;
}

async function playEpisode(ep, trId, startSeconds) {
  if (!trId) trId = currentTranslationId || (_translationsList[0] && _translationsList[0].translationId);
  currentEpisode = ep;
  currentTranslationId = trId;
  currentSeconds = startSeconds || 0;

  const uiTitle = document.getElementById('uiTitle');
  const uiSub = document.getElementById('uiSub');
  if (uiTitle) uiTitle.textContent = currentTitle.title || '';
  if (uiSub) uiSub.textContent = 'Серия ' + ep;
  renderEpisodesMenu();
  renderAudioMenu();

  const video = document.getElementById('player');
  if (!video) return;

  if (currentHls) { currentHls.destroy(); currentHls = null; }

  try {
    const r = await fetch(API + '/api/episode/kodik?shikimoriId=' + currentTitle.shikimoriId + '&translationId=' + trId + '&episode=' + ep + '&maxQuality=' + resolveQuality());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    const m3u8 = data.url.startsWith('//') ? 'https:' + data.url : data.url;

    if (Hls.isSupported()) {
      currentHls = new Hls();
      currentHls.loadSource(m3u8);
      currentHls.attachMedia(video);
    } else {
      video.src = m3u8;
    }

    const seekTo = startSeconds && startSeconds > 5
      ? startSeconds
      : loadLocalProgress(currentTitle.shikimoriId, ep);

    if (seekTo && seekTo > 5) {
      video.addEventListener('loadedmetadata', () => { video.currentTime = seekTo; }, { once: true });
    }

    video.play().catch(() => {});

    if (progressTimer) clearInterval(progressTimer);
    progressTimer = setInterval(saveProgress, 10000);

  } catch (e) {
    alert('Не удалось открыть серию: ' + e.message);
  }
}

function localKey(id, ep) { return 'progress:' + id + ':' + ep; }
function saveLocalProgress(id, ep, sec) { try { localStorage.setItem(localKey(id, ep), String(Math.floor(sec))); } catch(e) {} }
function loadLocalProgress(id, ep) { const v = localStorage.getItem(localKey(id, ep)); return v ? Number(v) : 0; }

async function saveProgress() {
  if (!token || !currentTitle || !currentEpisode) return;
  try {
    await fetch(API + '/api/progress', {
      method: 'PATCH',
      headers: Object.assign({'Content-Type': 'application/json'}, authHeaders()),
      body: JSON.stringify({
        shikimoriId: currentTitle.shikimoriId,
        episode: currentEpisode,
        seconds: Math.floor(currentSeconds),
        title: currentTitle.title,
        originalTitle: currentTitle.originalTitle,
        posterUrl: currentTitle.posterUrl,
        translationId: Number(currentTranslationId),
        translationSource: 'kodik',
        translationName: currentTranslationName()
      })
    });
  } catch(e) {}
}

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveProgress(); });
window.addEventListener('beforeunload', () => { saveProgress(); });

async function reloadProgress() {
  if (!token || !currentTitle) return;
  try {
    const rr = await fetch(API + '/api/progress/' + currentTitle.shikimoriId, { headers: authHeaders() });
    if (!rr.ok) return;
    const last = await rr.json();
    if (last && last.episode) {
      const uiSub = document.getElementById('uiSub');
      if (uiSub) uiSub.textContent = 'Серия ' + last.episode + ' · продолжаем с ' + fmtTime(last.seconds);
    }
  } catch(e) {}
}

updateUserUI();
setTimeout(clearSearchInput, 100);
setTimeout(clearSearchInput, 500);
window.addEventListener('load', () => setTimeout(clearSearchInput, 100));

const params = new URLSearchParams(location.search);
const id = params.get('id');
const ep = params.get('ep');
const tr = params.get('tr');
const t = params.get('t');
const hash = location.hash.replace('#', '');

if (id) {
  openTitle(id, { ep: ep != null ? Number(ep) : null, tr: tr, t: t ? Number(t) : 0 });
} else if (hash === 'history') {
  switchTab('history');
} else {
  renderTab();
}
</script>
</body>
</html>
